<!DOCTYPE html>

<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans selection:bg-blue-600 selection:text-white">

            <input type="file" id="fileInput" accept=".mermaid,.txt,.md" class="hidden">

                📂 Open File / Markdown

            <button id="downloadMdBtn" class="bg-emerald-600 hover:bg-emerald-500 text-white font-medium text-sm py-2 px-4 rounded-lg transition-all flex items-center gap-2 active:scale-95 shadow-md shadow-emerald-600/10">
                📝 Download .MD
            </button>
            <button id="downloadSvgBtn" class="bg-blue-600 hover:bg-blue-500 text-white font-medium text-sm py-2 px-4 rounded-lg transition-all flex items-center gap-2 active:scale-95 shadow-md shadow-blue-600/10">
                💾 Download SVG
            </button>
        </div>
    </header>

    <!-- Main Container Workspace Split Layout Grid -->
    <main class="flex-1 grid grid-cols-1 lg:grid-cols-12 overflow-hidden min-h-0">
        
        <!-- Left Controlling Column Side Panel Panel -->
        <section class="lg:col-span-4 border-r border-slate-800 bg-slate-950 flex flex-col overflow-hidden">
            
            <!-- Real-Time Telemetry System Logging Window Banner -->
            <div id="statusBanner" class="m-4 p-3 bg-slate-900 border border-slate-800 text-slate-300 rounded-lg text-xs font-mono flex flex-col gap-1 transition-all">
                <div class="flex items-center gap-2 text-slate-400 font-semibold uppercase tracking-wider text-[10px]">
                    <span class="h-2 w-2 rounded-full bg-green-500" id="statusDot"></span>
                    Engine Telemetry Status
                </div>
                <div id="statusText" class="mt-1 leading-relaxed">System ready. Open a markdown file to view it in clean Top-Down flow.</div>
            </div>

            <!-- Interactive AI Prompt Modification Input Field Wrapper -->
            <div class="px-4 pb-4 border-b border-slate-800">
                <label for="aiPrompt" class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">
                    🤖 AI Update Agent Prompt
                </label>
                <div class="flex flex-col gap-2">
                    <textarea id="aiPrompt" rows="3" 
                        class="w-full bg-slate-900 border border-slate-800 rounded-lg p-3 text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 resize-none font-sans"
                        placeholder="e.g., In phase 4, change step 4.1 text to 'Optimized Routing Assign'..."></textarea>
                    <button id="runAiBtn" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-semibold text-sm py-2.5 px-4 rounded-lg transition-all active:scale-[0.98] shadow-lg shadow-blue-900/20 flex items-center justify-center gap-2">
                        ✨ Update with Local AI
                    </button>
                </div>
            </div>

            <!-- Editable Source Text Code Panel -->
            <div class="flex-1 flex flex-col min-h-0">
                <div class="bg-slate-950 px-4 py-2 border-b border-slate-900 flex justify-between items-center shrink-0">
                    <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">Live Mermaid Script Source</span>
                    <span class="text-[10px] font-mono text-slate-500">Auto-Cleaning Converter</span>
                </div>
                <div class="flex-1 overflow-hidden relative">
                    <textarea id="codeEditor" 
                        class="w-full h-full bg-slate-950 p-4 font-mono text-sm text-emerald-400 border-none focus:outline-none focus:ring-0 resize-none leading-relaxed selection:bg-slate-800"
                        spellcheck="false">graph TD
    A[Start] --> B(Upload Markdown File)
    B --> C{Fixed Layout Rendering}
    C -->|No More Spiderwebs| D[Beautiful Top Down Flow]</textarea>
                </div>
            </div>

        </section>

        <!-- Right Side Canvas View Preview Rendering Board Container -->
        <section id="dropZone" class="lg:col-span-8 bg-slate-900 relative flex flex-col overflow-hidden group">
            
            <!-- Canvas Action HUD Configuration Controls Strip -->
            <div class="absolute top-4 left-4 z-10 flex items-center gap-2 bg-slate-950/80 backdrop-blur-md border border-slate-800 p-1.5 rounded-xl shadow-xl">
                <button id="zoomOutBtn" class="h-8 w-8 hover:bg-slate-800 text-slate-400 hover:text-white rounded-lg transition-all flex items-center justify-center font-medium text-lg active:scale-90">-</button>
                <span id="zoomLevelDisplay" class="text-xs font-mono px-2 text-slate-300 min-w-[48px] text-center">100%</span>
                <button id="zoomInBtn" class="h-8 w-8 hover:bg-slate-800 text-slate-400 hover:text-white rounded-lg transition-all flex items-center justify-center font-medium text-lg active:scale-90">+</button>
                <div class="h-4 w-px bg-slate-800 mx-1"></div>
                <button id="fitScreenBtn" class="text-xs px-3 py-1.5 hover:bg-slate-800 text-slate-400 hover:text-white rounded-lg transition-all font-medium active:scale-95">Fit Screen</button>
                <button id="resetViewBtn" class="text-xs px-3 py-1.5 hover:bg-slate-800 text-slate-400 hover:text-white rounded-lg transition-all font-medium active:scale-95">Reset</button>
                <button id="reloadDiagramBtn" class="text-xs px-3 py-1.5 hover:bg-slate-800 text-slate-400 hover:text-white rounded-lg transition-all font-medium active:scale-95">Reload Diagram</button>
            </div>

            <!-- Drop Zone File Drag and Drop Visual Hint Overlay -->
            <div id="dragOverlay" class="absolute inset-0 bg-blue-600/10 border-4 border-dashed border-blue-500 z-20 hidden items-center justify-center backdrop-blur-sm pointer-events-none transition-all">
                <div class="bg-slate-950 px-6 py-4 rounded-xl border border-blue-500 shadow-2xl flex items-center gap-3">
                    <span class="text-2xl">📥</span>
                    <span class="text-sm font-semibold text-slate-200">Drop Markdown (.md) or Mermaid (.mermaid) File Here</span>
                </div>
            </div>

            <!-- Viewport Rendering Node Canvas -->
            <div id="viewportContainer" class="flex-1 overflow-auto relative cursor-grab active:cursor-grabbing flex items-center justify-center p-8 select-none">
                <div id="panZoomWrapper" class="origin-center transition-transform duration-75 will-change-transform">
                    <div id="renderTarget" class="bg-transparent flex items-center justify-center"></div>
                </div>
            </div>

        </section>
    </main>

    <!-- Global Application Engine Modules Integration Script -->
    <script type="module">
        import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
        import { CreateMLCEngine } from "https://esm.run/@mlc-ai/web-llm";

        const openFileBtn = document.getElementById('openFileBtn');
        const fileInput = document.getElementById('fileInput');
        const downloadMdBtn = document.getElementById('downloadMdBtn');
        const downloadSvgBtn = document.getElementById('downloadSvgBtn');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const aiPrompt = document.getElementById('aiPrompt');
        const runAiBtn = document.getElementById('runAiBtn');
        const codeEditor = document.getElementById('codeEditor');
        const dropZone = document.getElementById('dropZone');
        const dragOverlay = document.getElementById('dragOverlay');
        const renderTarget = document.getElementById('renderTarget');
        const panZoomWrapper = document.getElementById('panZoomWrapper');
        
        const zoomInBtn = document.getElementById('zoomInBtn');
        const zoomOutBtn = document.getElementById('zoomOutBtn');
        const zoomLevelDisplay = document.getElementById('zoomLevelDisplay');
        const fitScreenBtn = document.getElementById('fitScreenBtn');
        const resetViewBtn = document.getElementById('resetViewBtn');

        let webLlmEngine = null;
       // const MODEL_ID = "Llama-3.2-1B-Instruct-q4f16_1-MLC"; 
       // const MODEL_ID = "Llama-3-8B-Instruct-q4f16_1-MLC
        const MODEL_ID = "Qwen2.5-Coder-7B-Instruct-q4f16_1-MLC";

        let transformState = { x: 0, y: 0, scale: 1 };
        let isDragging = false;
        let dragStart = { x: 0, y: 0 };

        mermaid.initialize({
            startOnLoad: false,
            theme: 'dark',
            securityLevel: 'loose',
            flowchart: { 
                useMaxWidth: false, 
                htmlLabels: true,
                curve: 'linear'
            }
        });

        function extractRawMermaid(text) {
            if (!text) return "";
            let cleaned = text.trim();
            const mermaidRegex = /```mermaid\s*([\s\S]*?)\s*```/i;
            const genericRegex = /```\s*([\s\S]*?)\s*```/;
            
            if (mermaidRegex.test(cleaned)) {
                const match = cleaned.match(mermaidRegex);
                if(match && match[1]) cleaned = match[1];
            } else if (genericRegex.test(cleaned)) {
                const match = cleaned.match(genericRegex);
                if(match && match[1]) cleaned = match[1];
            }
            return cleaned.trim();
        }

        function updateTransform() {
            panZoomWrapper.style.transform = `translate(${transformState.x}px, ${transformState.y}px) scale(${transformState.scale})`;
            zoomLevelDisplay.textContent = `${Math.round(transformState.scale * 100)}%`;
        }

        document.getElementById('viewportContainer').addEventListener('mousedown', (e) => {
            if (e.target.closest('#zoomInBtn, #zoomOutBtn, #zoomLevelDisplay, #fitScreenBtn, #resetViewBtn')) return;
            isDragging = true;
            dragStart = { x: e.clientX - transformState.x, y: e.clientY - transformState.y };
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            transformState.x = e.clientX - dragStart.x;
            transformState.y = e.clientY - dragStart.y;
            updateTransform();
        });

        window.addEventListener('mouseup', () => isDragging = false);

        document.getElementById('viewportContainer').addEventListener('wheel', (e) => {
            e.preventDefault();
            const zoomFactor = 1.1;
            if (e.deltaY < 0) {
                transformState.scale = Math.min(transformState.scale * zoomFactor, 5);
            } else {
                transformState.scale = Math.max(transformState.scale / zoomFactor, 0.1);
            }
            updateTransform();
        }, { passive: false });

        zoomInBtn.addEventListener('click', () => { transformState.scale = Math.min(transformState.scale * 1.2, 5); updateTransform(); });
        zoomOutBtn.addEventListener('click', () => { transformState.scale = Math.max(transformState.scale / 1.2, 0.1); updateTransform(); });
        resetViewBtn.addEventListener('click', () => { transformState = { x: 0, y: 0, scale: 1 }; updateTransform(); });

        function autoFitLayout() {
            const svgElement = renderTarget.querySelector('svg');
            if (!svgElement) return;
            const container = document.getElementById('viewportContainer');
            const svgWidth = svgElement.viewBox.baseVal.width || svgElement.getBoundingClientRect().width;
            const svgHeight = svgElement.viewBox.baseVal.height || svgElement.getBoundingClientRect().height;
            
            if (!svgWidth || !svgHeight) return;
            
            const scaleX = (container.clientWidth - 40) / svgWidth;
            const scaleY = (container.clientHeight - 40) / svgHeight;
            let finalScale = Math.min(scaleX, scaleY);
            
            finalScale = Math.max(Math.min(finalScale, 1.0), 0.1);
            
            transformState = { x: 0, y: 0, scale: finalScale };
            updateTransform();
        }
        fitScreenBtn.addEventListener('click', autoFitLayout);

        // async function renderDiagram() {
        //     const rawSyntax = extractRawMermaid(codeEditor.value);
        //     if (!rawSyntax) {
        //         renderTarget.innerHTML = `<div class="text-slate-500 font-mono text-sm">Editor target syntax workspace is empty.</div>`;
        //         return;
        //     }
        //     try {
        //         const uniqueId = `mermaid-render-${Date.now()}`;
        //         renderTarget.innerHTML = `<div id="${uniqueId}" class="mermaid">${rawSyntax}</div>`;
        //         await mermaid.run({ nodes: [document.getElementById(uniqueId)] });

        //     } catch (err) {
        //         statusDot.className = "h-2 w-2 rounded-full bg-red-500";
        //         statusText.textContent = "Mermaid Syntax Error. Checking input format rules.";

async function renderDiagram() {
    let rawSyntax = extractRawMermaid(codeEditor.value);
    if (!rawSyntax) return;
    try {
        // MINIMUM FIX: Strips text anomalies introduced by the local AI that cause font-overlapping layout crashes
        rawSyntax = rawSyntax.replace(/[\u201C\u201D]/g, '"').replace(/&quot;/g, '"').replace(/\\"/g, '"');

        const uniqueId = `mermaid-render-${Date.now()}`;
        renderTarget.innerHTML = `<div id="${uniqueId}" class="mermaid">${rawSyntax}</div>`;
        await mermaid.run({ nodes: [document.getElementById(uniqueId)] });
        
        const realSvg = renderTarget.querySelector('svg');
        if(realSvg) { realSvg.style.maxWidth = 'none'; realSvg.style.height = 'auto'; }
        statusDot.className = "h-2 w-2 rounded-full bg-green-500";
        statusText.textContent = "Syntax compilation successful. Diagram rendered.";
    } catch (err) {
        statusDot.className = "h-2 w-2 rounded-full bg-red-500";
        statusText.textContent = "Mermaid Syntax Error.";
    }
}

        codeEditor.addEventListener('input', () => {
            const cleaned = extractRawMermaid(codeEditor.value);
            if (codeEditor.value !== cleaned && codeEditor.value.includes('```')) {
                codeEditor.value = cleaned;
            }
            renderDiagram();
        });

        async function lazyLoadAiEngine() {
            if (webLlmEngine) return webLlmEngine;
            runAiBtn.disabled = true;
            statusDot.className = "h-2 w-2 rounded-full bg-orange-500 animate-pulse";
            statusText.textContent = "Initializing local WebGPU core context vectors...";

            try {
                webLlmEngine = await CreateMLCEngine(MODEL_ID, {
                    initProgressCallback: (progress) => {
                        const percent = Math.round(progress.progress * 100);
                        statusText.textContent = `Loading Local Model Matrix: ${percent}% (${progress.text})`;
                        if (percent >= 100) {
                            statusDot.className = "h-2 w-2 rounded-full bg-green-500 shadow-sm shadow-green-500/50";
                        }
                    }
                });
                runAiBtn.disabled = false;
                return webLlmEngine;
            } catch (error) {
                statusDot.className = "h-2 w-2 rounded-full bg-red-500";
                statusText.textContent = `GPU Error: Allocation rejected (${error.message})`;
                runAiBtn.disabled = false;
                throw error;
            }
        }


        runAiBtn.addEventListener('click', async () => {
    const instruction = aiPrompt.value.trim();
    const currentCode = extractRawMermaid(codeEditor.value.trim());
    if (!instruction) return;

    try {
        const engine = await lazyLoadAiEngine();
        statusDot.className = "h-2 w-2 rounded-full bg-blue-500 animate-pulse";
        statusText.textContent = "Processing layout instruction modifications locally on your device GPU...";
        runAiBtn.disabled = true;

        // The upgraded system prompt defined above
       const sysPrompt = `You are a precision systems architect and master Mermaid JS developer.
Your sole task is to analyze the user's natural language update instruction, locate the targeted sections in the current diagram layout code, and output the updated version.

Follow these strict structural execution parameters:
1. STRICT ARCHITECTURAL PRESERVATION: You must keep the rest of the diagram code perfectly intact and unchanged. Do not alter, delete, rewrite, or optimize a single phrase, label, node ID, subgraph name, or layout segment outside of the user's specific request scope.
2. Apply the requested structural modifications surgically to the targeted nodes or routing vectors.
3. Keep the output string clean. Do not wrap the final code block inside markdown syntax wrappers like \`\`\`mermaid or triple backticks. Start directly with the graph definition keyword (e.g., 'graph TD', 'sequenceDiagram').`;


        const userTextPrompt = `Current Code:\n${currentCode}\n\nModification Request Directive:\n${instruction}\n\nUpdated Code Syntax Input Output:`;

        const chatCompletion = await engine.chat.completions.create({
            messages: [
                { role: "system", content: sysPrompt },
                { role: "user", content: userTextPrompt }
            ],
            temperature: 0.1
        });

        // Safe evaluation fix to stop the crash bug
        if (!chatCompletion?.choices?.[0]?.message?.content) {
            throw new Error("Local AI failed to generate a coherent update patch. Please rephrase your business description slightly.");
        }

        let parsedAiOutput = chatCompletion.choices[0].message.content.trim();
        parsedAiOutput = extractRawMermaid(parsedAiOutput);

        if (parsedAiOutput.length < 10) {
            throw new Error("Generated script structural integrity check failed.");
        }

                // 1. Inject the verified AI output into the text workspace editor
        codeEditor.value = parsedAiOutput;
        aiPrompt.value = ""; 
        
        statusDot.className = "h-2 w-2 rounded-full bg-blue-400 animate-pulse";
        statusText.textContent = "AI generation complete. Compiling vector tracks and mapping nodes...";
        
        // 2. Clear out any previous layout execution queues
        renderTarget.innerHTML = "";

        await initializeFreshCanvas(parsedAiOutput);


    } catch (err) {
        statusDot.className = "h-2 w-2 rounded-full bg-red-500";
        statusText.textContent = `Execution Error: ${err.message}`;
    } finally {
        runAiBtn.disabled = false;
    }
});



        openFileBtn.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            processUploadedFile(file);
        });

        window.addEventListener('dragover', (e) => { e.preventDefault(); dragOverlay.classList.remove('hidden'); dragOverlay.classList.add('flex'); });
        window.addEventListener('dragleave', (e) => { if (e.relatedTarget === null) { dragOverlay.classList.add('hidden'); dragOverlay.classList.remove('flex'); } });
        dropZone.addEventListener('dragover', (e) => e.preventDefault());
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dragOverlay.classList.add('hidden'); dragOverlay.classList.remove('flex');
            const file = e.dataTransfer.files[0];
            if (file) processUploadedFile(file);
        });

        function processUploadedFile(file) {
            const reader = new FileReader();
            reader.onload = (event) => {
                const rawFileContent = event.target.result;
                codeEditor.value = extractRawMermaid(rawFileContent);
                renderDiagram();
                setTimeout(autoFitLayout, 250);
                statusText.textContent = `Loaded Top-Down Canvas: ${file.name}`;
            };
            reader.readAsText(file);
        }

        // NEW FEATURE: Download Diagram wrapped in Markdown block format
        downloadMdBtn.addEventListener('click', () => {
            const rawSyntax = extractRawMermaid(codeEditor.value);
            if (!rawSyntax) {
                alert("No diagram syntax found to download.");
                return;
            }
            const markdownContent = `\`\`\`mermaid\n${rawSyntax}\n\`\`\``;
            const blob = new Blob([markdownContent], { type: 'text/markdown;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            
            const anchor = document.createElement('a');
            anchor.href = url;
            anchor.download = `mermaid-diagram-${Date.now()}.md`;
            document.body.appendChild(anchor);
            anchor.click();
            document.body.removeChild(anchor);
            URL.revokeObjectURL(url);
        });

        downloadSvgBtn.addEventListener('click', () => {
            const svgNode = renderTarget.querySelector('svg');
            if (!svgNode) {
                alert("No compiled layout content found inside render canvas space.");
                return;
            }
            const serializedSvg = new XMLSerializer().serializeToString(svgNode);
            const blobBlob = new Blob([serializedSvg], { type: 'image/svg+xml;charset=utf-8' });
            const blobUrl = URL.createObjectURL(blobBlob);
            
            const anchor = document.createElement('a');
            anchor.href = blobUrl;
            anchor.download = `mermaid-topdown-${Date.now()}.svg`;
            document.body.appendChild(anchor);
            anchor.click();
            document.body.removeChild(anchor);
            URL.revokeObjectURL(blobUrl);
        });

        renderDiagram();
        setTimeout(autoFitLayout, 500);

        // NEW SEPARATE FUNCTION: Bundles the clean, file-upload style loading sequence
async function initializeFreshCanvas(cleanCode) {
    // 1. Completely clear and reset the graphics canvas containers
    renderTarget.innerHTML = "";
    codeEditor.value = "";
    
    // 2. Micro-task pause to force the browser to flush the layout tree
    await new Promise(resolve => setTimeout(resolve, 60));
    
    // 3. Load text fresh into the editor view
    codeEditor.value = cleanCode;
    
    // 4. Trigger the standard rendering loop
    await renderDiagram();
    
    // 5. Verification check loop to ensure vector boxes are drawn
    await new Promise((resolve) => {
        const checkReady = () => {
            const svg = renderTarget.querySelector('svg');
            if (svg && svg.viewBox && svg.viewBox.baseVal.width > 0) {
                resolve();
            } else {
                requestAnimationFrame(checkReady);
            }
        };
        checkReady();
    });
    
    // 6. Autofit the layout view camera coordinates
    autoFitLayout();
}
// NEW SEPARATE FUNCTION: Reloads and completely repaints the active diagram state
async function reloadCurrentDiagram() {
    const currentCode = codeEditor.value.trim();
    if (!currentCode) return;

    statusDot.className = "h-2 w-2 rounded-full bg-blue-400 animate-pulse";
    statusText.textContent = "Forcing full canvas structural refresh...";

    // Call your extracted modular load pipeline function to reset layout vectors cleanly
    await initializeFreshCanvas(currentCode);

    statusDot.className = "h-2 w-2 rounded-full bg-green-500";
    statusText.textContent = "Diagram reloaded and layout calculations updated successfully.";
}

// Bind the new button action to our separate reload function
document.getElementById('reloadDiagramBtn').addEventListener('click', reloadCurrentDiagram);

    </script>
